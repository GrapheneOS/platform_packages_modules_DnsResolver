[package]
name = "socketbroker"
version = "0.1.0"
edition = "2021"

[dependencies]
android_logger = { version = "0.15.1", default-features = false }
anyhow = "1.0.99"
bytemuck = "1.24.0"
libc = "0.2.177"
clap = "4.5.52"
log = { version = "^0.4.28", features = ["std"]}
nix = { version = "0.29.0", default-features = false }
resolvrs_utils = { path = "../lib/resolvrs_utils" }
socket2 = { version = "0.6.0", features = ["all"] }

# It follows the default Rust lints on Android. (Ref: build/soong/rust/config/lints.go)
[lints.rust]
deprecated = "allow"
unknown_lints = "allow"
missing_docs = "deny"
warning = "deny"
unsafe_op_in_unsafe_fn = "deny"
# Note that lints.go temporarily includes mismatched_lifetime_syntaxes = "allow" which is omitted
# here.

[lints.clippy]
disallowed_names = "allow"
empty_line_after_doc_comments = "allow"
type-complexity = "allow"
unnecessary_fallible_conversions = "allow"
unnecessary-wraps = "allow"
unusual-byte-groupings = "allow"
upper-case-acronyms = "allow"
uninlined_format_args = "allow"
undocumented_unsafe_blocks = "deny"

[profile.release]
strip = true
opt-level = "z"
lto = true
